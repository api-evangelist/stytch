        template_id:
          type: string
        status_code:
          type: integer
          format: int32
      description: Response type
      required:
      - request_id
      - template_id
      - status_code
    pwa_email_template_v3_GetResponse:
      type: object
      properties:
        request_id:
          type: string
        email_template:
          $ref: '#/components/schemas/pwa_email_template_v3_EmailTemplate'
        status_code:
          type: integer
          format: int32
      description: Response type
      required:
      - request_id
      - email_template
      - status_code
    pwa_email_template_v3_TemplateType:
      type: string
      enum:
      - LOGIN
      - SIGNUP
      - INVITE
      - RESET_PASSWORD
      - ONE_TIME_PASSCODE
      - ONE_TIME_PASSCODE_SIGNUP
      - VERIFY_EMAIL_PASSWORD_RESET
      - UNLOCK
      - PREBUILT
    pwa_email_template_v3_SetDefaultResponse:
      type: object
      properties:
        request_id:
          type: string
        status_code:
          type: integer
          format: int32
      description: Response type
      required:
