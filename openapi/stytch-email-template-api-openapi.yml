components:
  schemas:
    pwa_email_template_v3_FontFamily:
      type: string
      enum:
      - ARIAL
      - BRUSH_SCRIPT_MT
      - COURIER_NEW
      - GEORGIA
      - HELVETICA
      - TAHOMA
      - TIMES_NEW_ROMAN
      - TREBUCHET_MS
      - VERDANA
    pwa_email_template_v3_SenderInformation:
      type: object
      properties:
        from_local_part:
          type: string
        from_domain:
          type: string
        from_name:
          type: string
        reply_to_local_part:
          type: string
        reply_to_name:
          type: string
    pwa_email_template_v3_PrebuiltCustomization:
      type: object
      properties:
        button_border_radius:
          type: number
          format: float
        button_color:
          type: string
        button_text_color:
          type: string
        font_family:
          $ref: '#/components/schemas/pwa_email_template_v3_FontFamily'
        text_alignment:
          $ref: '#/components/schemas/pwa_email_template_v3_TextAlignment'
    pwa_email_template_v3_CreateRequest:
      type: object
      properties:
        template_id:
          type: string
        name:
          type: string
        sender_information:
          $ref: '#/components/schemas/pwa_email_template_v3_SenderInformation'
        prebuilt_customization:
          $ref: '#/components/schemas/pwa_email_template_v3_PrebuiltCustomization'
        custom_html_customization:
          $ref: '#/components/schemas/pwa_email_template_v3_CustomHTMLCustomization'
      description: Request type
      required:
      - template_id
    pwa_email_template_v3_UpdateResponse:
      type: object
      properties:
        request_id:
          type: string
        email_template:
          $ref: '#/components/schemas/pwa_email_template_v3_EmailTemplate'
        status_code:
          type: integer
          format: int32
      description: Response type
      required:
      - request_id
      - email_template
      - status_code
    pwa_email_template_v3_CreateResponse:
      type: object
      properties:
        request_id:
          type: string
        email_template:
          $ref: '#/components/schemas/pwa_email_template_v3_EmailTemplate'
        status_code:
          type: integer
          format: int32
      description: Response type
      required:
      - request_id
      - email_template
      - status_code
    pwa_email_template_v3_GetDefaultResponse:
      type: object
      properties:
        request_id:
