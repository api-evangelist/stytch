        email_address:
          type: string
          description: The email address of the Member.
        status:
          type: string
          description: 'The status of the Member. The possible values are: `pending`, `invited`, `active`, or `deleted`.'
        name:
          type: string
          description: The name of the Member.
        sso_registrations:
          type: array
