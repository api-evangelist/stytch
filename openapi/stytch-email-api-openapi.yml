      summary: Send
      operationId: api_b2b_magic_v1_b2b_magic_links_email_discovery_Send
      tags:
      - Email
      description: Send a discovery magic link to an email address. The magic link is valid for 60 minutes.
      requestBody:
        required: true
        content:
