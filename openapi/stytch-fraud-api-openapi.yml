        verdict_reason:
          type: string
          description: The verdict reason.
        default_action:
          $ref: '#/components/schemas/api_fraud_v1_VerdictReasonActionAction'
          description: The default action returned for the specified verdict reason in a fingerprint lookup when no overrides are specified.
        override_action:
          $ref: '#/components/schemas/api_fraud_v1_VerdictReasonActionAction'
          description: If not null, this action will be returned for the specified verdict reason in a fingerprint lookup, in place of the default action.
        override_created_at:
          type: string
          description: The time when the override was created, if one exists. Values conform to the RFC 3339 standard and are expressed in UTC, e.g. `2021-12-29T12:33:09Z`.
        override_description:
          type: string
          description: A description of the override, if one exists.
      required:
      - verdict_reason
      - default_action
    api_fraud_v1_Metadata:
      type: object
      properties:
        external_id:
          type: string
          description: An external ID, such as a user ID, that you wish to associate with the telemetry ID.
        organization_id:
          type: string
          description: The organization ID you wish to associate with the telemetry ID.
        user_action:
          type: string
          description: The user action, such as 'login', that you wish to associate with the telemetry ID.
    api_fraud_v1_VerdictAction:
      type: string
      enum:
      - ALLOW
      - CHALLENGE
      - BLOCK
    api_fraud_v1_NetworkProperties:
      type: object
      properties:
        ip_address:
