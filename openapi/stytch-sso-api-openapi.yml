        source: "# PUT /v1/b2b/sso/external/{organization_id}/connections/{connection_id}\ncurl --request PUT \\\n  --url https://test.stytch.com/v1/b2b/sso/external/${organizationId}/connections/${externalConnectionId} \\\n  -u '${projectId}:${secret}' \\\n  -H 'Content-Type: application/json' \\\n  -H \"X-Stytch-Member-Session: ${sessionToken}\""
