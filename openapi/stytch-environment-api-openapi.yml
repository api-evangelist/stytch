components:
  schemas:
    pwa_environment_v3_Metrics:
      type: object
      properties:
        user_count:
          type: integer
          format: int32
          minimum: 0
        organization_count:
          type: integer
          format: int32
          minimum: 0
        member_count:
          type: integer
          format: int32
          minimum: 0
        m2m_client_count:
          type: integer
          format: int32
          minimum: 0
      required:
      - user_count
      - organization_count
      - member_count
      - m2m_client_count
    pwa_environment_v3_UpdateRequest:
      type: object
      properties:
        name:
          type: string
        cross_org_passwords_enabled:
          type: boolean
        user_impersonation_enabled:
          type: boolean
        zero_downtime_session_migration_url:
          type: string
        use_custom_domain_in_magic_link_emails:
          type: boolean
        user_lock_self_serve_enabled:
          type: boolean
        user_lock_threshold:
          type: integer
          format: int32
        user_lock_ttl:
          type: integer
          format: int32
        idp_authorization_url:
          type: string
        idp_dynamic_client_registration_enabled:
          type: boolean
        idp_dynamic_client_registration_access_token_template_content:
          type: string
      description: Request type
    pwa_environment_v3_GetMetricsResponse:
      type: object
      properties:
        request_id:
          type: string
        metrics:
          $ref: '#/components/schemas/pwa_environment_v3_Metrics'
        status_code:
          type: integer
          format: int32
      description: Response type
      required:
      - request_id
      - metrics
      - status_code
    pwa_environment_v3_Environment:
      type: object
      properties:
        environment_slug:
          type: string
        project_slug:
          type: string
        name:
          type: string
        oauth_callback_id:
          type: string
        cross_org_passwords_enabled:
          type: boolean
        user_impersonation_enabled:
          type: boolean
        zero_downtime_session_migration_url:
          type: string
        use_custom_domain_in_magic_link_emails:
          type: boolean
        user_lock_self_serve_enabled:
          type: boolean
        user_lock_threshold:
          type: integer
          format: int32
        user_lock_ttl:
          type: integer
          format: int32
        idp_authorization_url:
          type: string
        idp_dynamic_client_registration_enabled:
          type: boolean
        idp_dynamic_client_registration_access_token_template_content:
          type: string
        project_id:
          type: string
        type:
          $ref: '#/components/schemas/pwa_environment_v3_EnvironmentType'
        created_at:
          type: string
      required:
      - environment_slug
      - project_slug
      - name
      - oauth_callback_id
      - cross_org_passwords_enabled
      - user_impersonation_enabled
      - zero_downtime_session_migration_url
      - use_custom_domain_in_magic_link_emails
      - user_lock_self_serve_enabled
      - user_lock_threshold
      - user_lock_ttl
      - idp_authorization_url
      - idp_dynamic_client_registration_enabled
      - idp_dynamic_client_registration_access_token_template_content
      - project_id
    pwa_environment_v3_DeleteResponse:
      type: object
      properties:
        request_id:
          type: string
        status_code:
          type: integer
          format: int32
      description: Response type
      required:
      - request_id
      - status_code
    pwa_environment_v3_GetAllResponse:
      type: object
      properties:
        request_id:
          type: string
        environments:
          type: array
          items:
            $ref: '#/components/schemas/pwa_environment_v3_Environment'
        status_code:
          type: integer
          format: int32
      description: Response type
      required:
      - request_id
      - environments
      - status_code
    pwa_environment_v3_EnvironmentType:
      type: string
      enum:
      - LIVE
      - TEST
    pwa_environment_v3_UpdateResponse:
      type: object
      properties:
        request_id:
          type: string
        environment:
          $ref: '#/components/schemas/pwa_environment_v3_Environment'
        status_code:
          type: integer
          format: int32
      description: Response type
      required:
      - request_id
      - environment
      - status_code
    pwa_environment_v3_CreateRequest:
      type: object
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/pwa_environment_v3_EnvironmentType'
        environment_slug:
          type: string
        cross_org_passwords_enabled:
          type: boolean
        user_impersonation_enabled:
          type: boolean
        zero_downtime_session_migration_url:
          type: string
        user_lock_self_serve_enabled:
          type: boolean
        user_lock_threshold:
          type: integer
          format: int32
        user_lock_ttl:
          type: integer
          format: int32
        idp_authorization_url:
          type: string
        idp_dynamic_client_registration_enabled:
          type: boolean
        idp_dynamic_client_registration_access_token_template_content:
          type: string
      description: Request type
      required:
      - name
    pwa_environment_v3_GetResponse:
      type: object
      properties:
        request_id:
          type: string
        environment:
          $ref: '#/components/schemas/pwa_environment_v3_Environment'
        status_code:
          type: integer
          format: int32
      description: Response type
      required:
      - request_id
      - environment
      - status_code
    pwa_environment_v3_CreateResponse:
      type: object
      properties:
        request_id:
          type: string
        environment:
          $ref: '#/components/schemas/pwa_environment_v3_Environment'
        status_code:
          type: integer
          format: int32
      description: Response type
      required:
      - request_id
      - environment
      - status_code
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
