components:
  schemas:
    api_fraud_v1_fraud_verdict_reasons_ListResponse:
      type: object
      properties:
        request_id:
          type: string
          description: Globally unique UUID that is returned with every API call. This value is important to log for debugging purposes; we may ask for this value to help identify a specific API call when helping you debug an issue.
        verdict_reason_actions:
          type: array
          items:
            $ref: '#/components/schemas/api_fraud_v1_VerdictReasonAction'
          description: Information about verdict reasons and any overrides that were set on them.
        status_code:
          type: integer
          format: int32
          description: The HTTP status code of the response. Stytch follows standard HTTP response status code patterns, e.g. 2XX values equate to success, 3XX values are redirects, 4XX are client errors, and 5XX are server errors.
      required:
      - request_id
      - verdict_reason_actions
      - status_code
    api_fraud_v1_fraud_rules_ListRequest:
      type: object
      properties:
        cursor:
          type: string
          description: The `cursor` field allows you to paginate through your results. Each result array is limited to 100 results. If your query returns more than 100 results, you will need to paginate the responses using the `cursor`. If you receive a response that includes a non-null `next_cursor`, repeat the request with the `next_cursor` value set to the `cursor` field to retrieve the next page of results. Continue to make requests until the `next_cursor` in the response is null.
        limit:
          type: integer
          format: int32
          description: The number of results to return per page. The default limit is 10. A maximum of 100 results can be returned by a single get request. If the total size of your result set is greater than one page size, you must paginate the response. See the `cursor` field.
      description: Request type
    api_fraud_v1_Verdict:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/api_fraud_v1_VerdictAction'
          description: "The suggested action based on the fingerprint review. The available actions are:\n  * `ALLOW` - This is a known valid device grouping or device profile that is part of the default ALLOW listed set of known devices by Stytch. This grouping is made up of verified device profiles that match the characteristics of known/authentic traffic origins\n  * `BLOCK` - This is a known bad or malicious device profile that is undesirable and should be blocked from completing the privileged action in question\n  * `CHALLENGE` - This is an unknown or potentially malicious device that should be put through increased friction such as 2FA or other forms of extended user verification before allowing the privileged action to proceed\n  "
        reasons:
          type: array
          items:
            type: string
          description: A set of contextual clues to inform why a `CHALLENGE` or `BLOCK` action was suggested. For a list of possible Reasons, see [Warning Flags (Verdict Reasons)](https://stytch.com/docs/docs/fraud/guides/device-fingerprinting/reference/warning-flags-verdict-reasons).
        detected_device_type:
          type: string
          description: The operating system and architecture that took the fingerprint.
        is_authentic_device:
          type: boolean
          description: The assessment of whether this is an authentic device. It will be false if hardware or browser deception is detected.
        verdict_reason_overrides:
          type: array
          items:
            $ref: '#/components/schemas/api_fraud_v1_VerdictReasonOverride'
          description: A list of verdict reason overrides that were applied, if any.
        rule_match_type:
          $ref: '#/components/schemas/api_fraud_v1_RuleType'
          description: The type of rule match that was applied (e.g. `VISITOR_ID`), if any. This field will only be present if there is a `RULE_MATCH` reason in the list of verdict reasons.
        rule_match_identifier:
          type: string
          description: The rule that was applied (e.g. a specific visitor ID value), if any. This field will only be present if there is a `RULE_MATCH` reason in the list of verdict reasons.
      required:
      - action
      - reasons
      - detected_device_type
      - is_authentic_device
      - verdict_reason_overrides
    api_fraud_v1_RiskResponseAction:
      type: string
      enum:
      - ALLOW
      - CHALLENGE
      - BLOCK
    api_fraud_v1_fraud_rules_SetResponse:
      type: object
