        hardware_fingerprint:
          type: string
          description: Combinations of signals to identify an operating system and architecture.
        browser_fingerprint:
          type: string
          description: Combination of signals to identify a browser and its specific version.
        visitor_fingerprint:
          type: string
          description: Cookie-less way of identifying a unique user.
        visitor_id:
          type: string
          description: The cookie stored on the user's device that uniquely identifies them.
        browser_id:
          type: string
          description: Combination of VisitorID and NetworkFingerprint to create a clear identifier of a browser.
      required:
      - network_fingerprint
      - hardware_fingerprint
      - browser_fingerprint
      - visitor_fingerprint
    api_fraud_v1_fraud_verdict_reasons_OverrideRequest:
      type: object
      properties:
        verdict_reason:
          type: string
          description: The verdict reason that you wish to override. For a list of possible reasons to override, see [Warning Flags (Verdict Reasons)](https://stytch.com/docs/docs/fraud/guides/device-fingerprinting/reference/warning-flags-verdict-reasons). You may not override the `RULE_MATCH` reason.
        override_action:
          $ref: '#/components/schemas/api_fraud_v1_OverrideRequestAction'
          description: The action that you want to be returned for the specified verdict reason. The override action must be one of `ALLOW`, `BLOCK`, or `CHALLENGE`.
        override_description:
          type: string
          description: An optional description for the verdict reason override.
      description: Request type
      required:
      - verdict_reason
      - override_action
    api_fraud_v1_fraud_fingerprint_LookupResponse:
      type: object
      properties:
        request_id:
          type: string
          description: Globally unique UUID that is returned with every API call. This value is important to log for debugging purposes; we may ask for this value to help identify a specific API call when helping you debug an issue.
        telemetry_id:
          type: string
          description: The telemetry ID associated with the fingerprint getting looked up.
        fingerprints:
          $ref: '#/components/schemas/api_fraud_v1_Fingerprints'
          description: 'A Stytch fingerprint consists of the following identifiers:'
        verdict:
          $ref: '#/components/schemas/api_fraud_v1_Verdict'
          description: The metadata associated with each fingerprint
        external_metadata:
          $ref: '#/components/schemas/api_fraud_v1_Metadata'
          description: External identifiers that you wish to associate with the given telemetry ID. You will be able to search for fingerprint results by these identifiers in the DFP analytics dashboard. External metadata fields may not exceed 65 characters. They may only contain alphanumerics and the characters `_` `-` `+` `.` or `@`.
        created_at:
          type: string
          description: The time when the fingerprint was taken. Values conform to the RFC 3339 standard and are expressed in UTC, e.g. `2021-12-29T12:33:09Z`.
        expires_at:
          type: string
          description: The timestamp when the fingerprint expires. Values conform to the RFC 3339 standard and are expressed in UTC, e.g. `2021-12-29T12:33:09Z`.
        status_code:
          type: integer
          format: int32
          description: The HTTP status code of the response. Stytch follows standard HTTP response status code patterns, e.g. 2XX values equate to success, 3XX values are redirects, 4XX are client errors, and 5XX are server errors.
        properties:
          $ref: '#/components/schemas/api_fraud_v1_Properties'
          description: Additional information about the user's browser and network.
        raw_signals:
          type: object
          additionalProperties: true
          description: The raw device attributes, such as screen size, that were collected by the Device Fingerprinting product to generate the fingerprints and verdict. You must be specifically enabled for the raw signals feature to see this field. You can find documentation for the specific fields in the [guides](https://stytch.com/docs/fraud/guides/device-fingerprinting/reference/raw-signals).
      required:
      - request_id
      - telemetry_id
      - fingerprints
      - verdict
      - external_metadata
      - created_at
      - expires_at
      - status_code
    api_fraud_v1_DomainInformation:
      type: object
      properties:
        has_mx_or_a_record:
          type: boolean
          description: Whether the email has appropriate DNS records to deliver a message.
        is_disposable_domain:
          type: boolean
          description: Whether the email domain is known to be disposable.
      required:
      - has_mx_or_a_record
      - is_disposable_domain
    api_fraud_v1_fraud_rules_SetRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/api_fraud_v1_RuleAction'
          description: 'The action that should be returned by a fingerprint lookup for that identifier with a `RULE_MATCH` reason. The following values are valid: `ALLOW`, `BLOCK`, `CHALLENGE`, or `NONE`. For country codes, `ALLOW` actions are not allowed. If a `NONE` action is specified, it will clear the stored rule.'
        visitor_id:
          type: string
          description: The visitor ID we want to set a rule for. Only one identifier can be specified in the request.
        browser_id:
          type: string
          description: The browser ID we want to set a rule for. Only one identifier can be specified in the request.
        visitor_fingerprint:
          type: string
          description: The visitor fingerprint we want to set a rule for. Only one identifier can be specified in the request.
        browser_fingerprint:
          type: string
          description: The browser fingerprint we want to set a rule for. Only one identifier can be specified in the request.
        hardware_fingerprint:
          type: string
          description: The hardware fingerprint we want to set a rule for. Only one identifier can be specified in the request.
        network_fingerprint:
          type: string
          description: The network fingerprint we want to set a rule for. Only one identifier can be specified in the request.
        expires_in_minutes:
          type: integer
          format: int32
          description: The number of minutes until this rule expires. If no `expires_in_minutes` is specified, then the rule is kept permanently.
        description:
          type: string
          description: An optional description for the rule.
        cidr_block:
          type: string
          description: The CIDR block we want to set a rule for. You may pass either an IP address or a CIDR block. The CIDR block prefix must be between 16 and 32, inclusive. If an end user's IP address is within this CIDR block, this rule will be applied. Only one identifier can be specified in the request.
        country_code:
          type: string
          description: The country code we want to set a rule for. The country code must be a valid ISO 3166-1 alpha-2 code. You may not set `ALLOW` rules for country codes. Only one identifier can be specified in the request.
        asn:
          type: string
          description: The ASN we want to set a rule for. The ASN must be the string representation of an integer between 0 and 4294967295, inclusive. Only one identifier can be specified in the request.
      description: Request type
      required:
      - action
    api_fraud_v1_fraud_verdict_reasons_OverrideResponse:
      type: object
      properties:
        request_id:
          type: string
          description: Globally unique UUID that is returned with every API call. This value is important to log for debugging purposes; we may ask for this value to help identify a specific API call when helping you debug an issue.
        verdict_reason_action:
          $ref: '#/components/schemas/api_fraud_v1_VerdictReasonAction'
          description: Information about the verdict reason override that was just set.
        status_code:
          type: integer
          format: int32
          description: The HTTP status code of the response. Stytch follows standard HTTP response status code patterns, e.g. 2XX values equate to success, 3XX values are redirects, 4XX are client errors, and 5XX are server errors.
      required:
      - request_id
      - verdict_reason_action
      - status_code
    api_fraud_v1_IPGeoProperties:
      type: object
      properties:
        city:
          type: string
          description: The city where the IP is located.
        region:
          type: string
          description: The region where the IP is located.
        country:
          type: string
          description: The country where the IP is located.
      required:
      - city
      - region
      - country
    api_fraud_v1_Properties:
      type: object
      properties:
        network_properties:
          $ref: '#/components/schemas/api_fraud_v1_NetworkProperties'
        browser_properties:
          $ref: '#/components/schemas/api_fraud_v1_BrowserProperties'
      required:
      - network_properties
      - browser_properties
