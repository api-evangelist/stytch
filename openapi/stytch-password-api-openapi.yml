        n_parameter:
          type: integer
          format: int32
          description: "The N value, also known as the iterations count. It must be a power of two greater than 1 and less than 262,145.\n      If your application's N parameter is larger than 262,144, please reach out to [support@stytch.com](mailto:support@stytch.com)"
        r_parameter:
          type: integer
          format: int32
          description: The r parameter, also known as the block size.
        p_parameter:
          type: integer
          format: int32
          description: The p parameter, also known as the parallelism factor.
        key_length:
          type: integer
          format: int32
          description: The key length, also known as the hash length.
      required:
      - salt
      - n_parameter
      - r_parameter
      - p_parameter
      - key_length
